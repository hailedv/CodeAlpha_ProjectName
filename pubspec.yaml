name: flashcard_quiz_app
description: A modern Flutter flashcard quiz app with AI-powered document upload. Study smarter with multiple-choice questions, instant feedback, and beautiful UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  provider: ^6.1.1                     # State management
  shared_preferences: ^2.2.2           # Local storage
  
  # Document upload features
  file_picker: ^6.1.1                  # File selection
  syncfusion_flutter_pdf: ^28.1.33     # PDF text extraction
  
  # UI components
  cupertino_icons: ^1.0.2              # iOS icons
  flutter_slidable: ^3.0.1             # Swipe actions
  fl_chart: ^0.66.0                    # Statistics charts
  
  # Utilities
  intl: ^0.20.2                        # Date formatting
  path_provider: ^2.1.2                # File paths
  share_plus: ^7.2.1                   # Share functionality

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
