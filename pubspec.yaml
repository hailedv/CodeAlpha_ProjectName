name: flashcard_quiz_app
description: A modern Flutter flashcard quiz app with AI-powered document upload. Built with Clean Architecture and Riverpod.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Functional Programming
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Document Processing
  file_picker: ^6.1.1
  syncfusion_flutter_pdf: ^28.1.33
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_slidable: ^3.0.1
  fl_chart: ^0.66.0
  
  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  device_preview: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mockito: ^5.4.4

flutter:
  uses-material-design: true
